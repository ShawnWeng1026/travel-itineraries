function countdown(){const now=Date.now(),start=Date.parse('2026-11-04T14:45:00+08:00'),end=Date.parse('2026-11-09T20:50:00+08:00');const el=document.getElementById('countdown');if(now<start){const mins=Math.floor((start-now)/60000),days=Math.floor(mins/1440),hrs=Math.floor(mins%1440/60);el.innerHTML=`${days}<span>天</span> ${String(hrs).padStart(2,'0')}<span>時</span>`;document.getElementById('countdown-caption').textContent=`距離出發 ${days} 天 ${hrs} 小時 ${mins%60} 分鐘 · 台灣時間`}else{el.innerHTML=now<=end?'旅途中':'旅程已結束';el.style.fontSize='22px';document.getElementById('countdown-caption').textContent=now<=end?'享受一家人的步調。':'把美好的回憶，留在旅行手帖裡。'}}countdown();setInterval(countdown,60000);

function duration(time){const match=time.match(/^(?:約\s*)?(\d{2}):(\d{2})～(\d{2}):(\d{2})$/);if(!match)return '停留時間：未設定';const m=Number(match[3])*60+Number(match[4])-Number(match[1])*60-Number(match[2]);return m>0?`時段長度 ${m>=60?Math.floor(m/60)+' 小時':''}${m%60?' '+m%60+' 分鐘':''}`:'停留時間：未設定'}

const checkGroups=[{id:'final',title:'出發前・六個關鍵確認',items:TRIP.finalChecks.map(x=>({label:x[0],note:x[1]}))},{id:'week',title:'出發前一週・最後核對',items:TRIP.weekChecklist.map(x=>({label:x[0],url:x[1]}))},{id:'daily',title:'出發當日・再看一眼',items:TRIP.dayChecklist.map(label=>({label}))}];
const storageKey='fukuoka-2026-v1.9-checklist';let checked={},storageAvailable=true;try{checked=JSON.parse(localStorage.getItem(storageKey)||'{}');if(!checked||typeof checked!=='object'||Array.isArray(checked))checked={};localStorage.setItem(storageKey,JSON.stringify(checked))}catch{storageAvailable=false;checked={}}
function checklistGroup(g){return `<div class="check-group"><h3>${g.title}</h3>${g.items.map((x,i)=>{const id=g.id+'-'+i;return `<div class="check-row"><input type="checkbox" id="${id}" data-check="${id}" ${checked[id]?'checked':''}><label for="${id}">${esc(x.label)}${x.note?`<small>${esc(x.note)}</small>`:''}</label>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" aria-label="查看 ${esc(x.label)} 官方資訊">${icon('external')}</a>`:''}</div>`}).join('')}</div>`}
document.getElementById('checklist').innerHTML=`${heading('checklist','Before you go','把準備做好，把步調放慢。','依 V1.9 原稿行前清單')}<div class="progress-panel"><div><div class="eyebrow">READY FOR THE JOURNEY</div><h3>出發準備進度</h3><p id="progress-caption"></p></div><div class="progress-number" id="progress-number"></div><div class="progress-track" role="progressbar" aria-label="清單完成百分比" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill"></div></div></div><div class="check-layout"><div>${checklistGroup(checkGroups[0])}</div><div>${checklistGroup(checkGroups[1])}${checklistGroup(checkGroups[2])}</div></div><p class="storage-note" id="storage-note"></p>`;
function updateProgress(){const total=checkGroups.reduce((n,g)=>n+g.items.length,0);const done=[...document.querySelectorAll('[data-check]')].filter(x=>x.checked).length;const pct=Math.round(done/total*100);document.getElementById('progress-number').innerHTML=`${pct}<small>%</small>`;document.getElementById('progress-caption').textContent=`已完成 ${done} / ${total} 項確認`;document.querySelector('.progress-fill').style.width=pct+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',pct);document.getElementById('storage-note').textContent=storageAvailable?'勾選進度自動儲存於此瀏覽器；重新整理後會保留。不同裝置不會同步。':'此瀏覽器無法使用本機儲存；目前勾選僅於本次開啟期間保留。'}
document.addEventListener('change',e=>{if(!e.target.matches('[data-check]'))return;checked[e.target.dataset.check]=e.target.checked;try{localStorage.setItem(storageKey,JSON.stringify(checked))}catch{storageAvailable=false}updateProgress()});updateProgress();showPage(location.hash.slice(1),false);
</script>
